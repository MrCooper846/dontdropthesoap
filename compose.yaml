name: dontdropthesoap
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: soap
      POSTGRES_PASSWORD: soap_local_only
      POSTGRES_DB: soap
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["soap-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soap -d soap"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  soap-postgres:
