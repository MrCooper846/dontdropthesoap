name: dontdropthesoap
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: soap
      POSTGRES_PASSWORD: soap_local_only
      POSTGRES_DB: soap
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["soap-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soap -d soap"]
      interval: 2s
      timeout: 3s
      retries: 20
  livekit-spike:
    image: livekit/livekit-server:v1.13.10
    profiles: ["voice-spike"]
    command:
      [
        "--dev",
        "--bind",
        "0.0.0.0",
        "--node-ip",
        "127.0.0.1",
        "--config",
        "/etc/livekit.yaml",
      ]
    ports:
      [
        "127.0.0.1:17880:7880",
        "127.0.0.1:17981:17981",
        "127.0.0.1:17982:17982/udp",
      ]
    volumes: ["./dev/livekit-spike.yaml:/etc/livekit.yaml:ro"]
volumes:
  soap-postgres:
